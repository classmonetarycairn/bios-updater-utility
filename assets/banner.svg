<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f14"/>
      <stop offset="0.55" stop-color="#0d1a1a"/>
      <stop offset="1" stop-color="#08120f"/>
    </linearGradient>
    <linearGradient id="chipBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2b2b"/>
      <stop offset="1" stop-color="#0e1717"/>
    </linearGradient>
    <linearGradient id="amberBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff7a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#39ff9c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#39ff9c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eafff1"/>
      <stop offset="1" stop-color="#9beeb8"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>

  <!-- circuit grid backdrop -->
  <g stroke="#1d3330" stroke-width="1" opacity="0.55">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="700" y1="0" x2="700" y2="360"/>
    <line x1="820" y1="0" x2="820" y2="360"/>
    <line x1="940" y1="0" x2="940" y2="360"/>
    <line x1="1060" y1="0" x2="1060" y2="360"/>
  </g>

  <!-- circuit traces -->
  <g stroke="#2f5c52" stroke-width="2.5" fill="none" opacity="0.8">
    <path d="M700 60 L700 100 L760 100 L760 150"/>
    <path d="M820 60 L820 90 L880 90 L880 130 L940 130"/>
    <path d="M940 300 L940 260 L1000 260 L1000 200"/>
    <path d="M1060 300 L1060 250 L1010 250"/>
    <path d="M700 240 L740 240 L740 280 L820 280"/>
    <path d="M1140 150 L1080 150 L1080 180"/>
  </g>
  <g fill="#3ddc97">
    <circle cx="760" cy="150" r="4"/>
    <circle cx="940" cy="130" r="4"/>
    <circle cx="1000" cy="200" r="4"/>
    <circle cx="1010" cy="250" r="4"/>
    <circle cx="820" cy="280" r="4"/>
    <circle cx="1080" cy="180" r="4"/>
  </g>

  <ellipse cx="900" cy="180" rx="320" ry="220" fill="url(#glow)"/>

  <!-- motherboard chip / CPU socket motif -->
  <g transform="translate(870,110)">
    <rect x="0" y="0" width="200" height="150" rx="10" fill="url(#chipBody)" stroke="#3ddc97" stroke-width="1.5" opacity="0.95"/>
    <rect x="20" y="20" width="160" height="110" rx="6" fill="#0a1514" stroke="#2f5c52" stroke-width="1"/>
    <!-- pins -->
    <g stroke="#3ddc97" stroke-width="2">
      <line x1="-14" y1="20" x2="0" y2="20"/>
      <line x1="-14" y1="40" x2="0" y2="40"/>
      <line x1="-14" y1="60" x2="0" y2="60"/>
      <line x1="-14" y1="80" x2="0" y2="80"/>
      <line x1="-14" y1="100" x2="0" y2="100"/>
      <line x1="-14" y1="120" x2="0" y2="120"/>
      <line x1="214" y1="20" x2="200" y2="20"/>
      <line x1="214" y1="40" x2="200" y2="40"/>
      <line x1="214" y1="60" x2="200" y2="60"/>
      <line x1="214" y1="80" x2="200" y2="80"/>
      <line x1="214" y1="100" x2="200" y2="100"/>
      <line x1="214" y1="120" x2="200" y2="120"/>
    </g>
    <!-- BIOS chip label lines -->
    <g stroke="#3ddc97" stroke-width="1.2" opacity="0.7">
      <line x1="32" y1="40" x2="130" y2="40"/>
      <line x1="32" y1="55" x2="150" y2="55"/>
      <line x1="32" y1="70" x2="110" y2="70"/>
    </g>
    <text x="35" y="105" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#3ddc97" opacity="0.9">BIOS</text>
    <!-- flash progress bar -->
    <rect x="35" y="115" width="130" height="8" rx="4" fill="#08120f" stroke="#2f5c52" stroke-width="0.8"/>
    <rect x="35" y="115" width="88" height="8" rx="4" fill="url(#amberBar)"/>
  </g>

  <!-- lightning flash icon -->
  <g transform="translate(1050,60)">
    <polygon points="20,0 4,42 16,42 8,80 34,34 20,34 30,0" fill="#ffb347" opacity="0.9"/>
  </g>

  <!-- headline -->
  <text x="60" y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="66" font-weight="700" fill="url(#textGlow)">
    <tspan x="60" y="150" textLength="640" lengthAdjust="spacingAndGlyphs">BIOS Updater</tspan>
    <tspan x="60" y="228" textLength="420" lengthAdjust="spacingAndGlyphs">Utility</tspan>
  </text>

  <!-- tagline -->
  <text x="60" y="272" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#a9d8c6" textLength="640" lengthAdjust="spacingAndGlyphs">
    Flashes pluggable firmware updater modules
  </text>
  <text x="60" y="300" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#a9d8c6" textLength="560" lengthAdjust="spacingAndGlyphs">
    for the motherboard BIOS ecosystem
  </text>

  <!-- accent underline -->
  <rect x="60" y="238" width="220" height="4" rx="2" fill="url(#amberBar)"/>
</svg>